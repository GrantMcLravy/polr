# Development environment for the Laravel 13 port: PHP 8.4 (repo mounted at
# /app, served by `php artisan serve`), MySQL 5.7 and a mail catcher.
name: polr-dev

services:
  app:
    build: .
    volumes:
      - ..:/app
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-18081}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: polr
      MYSQL_USER: polr
      MYSQL_PASSWORD: polrpw
    command: ["--character-set-server=utf8", "--collation-server=utf8_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      retries: 60

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${DEV_MAIL_PORT:-18026}:8025"

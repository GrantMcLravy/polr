; Polr container PHP settings (on top of php.ini-production).
expose_php = Off
memory_limit = 128M

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
; Keep checking timestamps: `php artisan config:cache` and the setup wizard
; rewrite files under bootstrap/cache at runtime.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

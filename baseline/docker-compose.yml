# Baseline environment: original Polr 2.3.0 on PHP 7.1 + MySQL 5.7.
# Started by baseline/run.sh; see baseline/README.md.
name: polr-baseline

services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: polr
      MYSQL_USER: polr
      MYSQL_PASSWORD: polrpw
    command: ["--character-set-server=utf8", "--collation-server=utf8_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      retries: 60

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${BASELINE_MAIL_PORT:-18025}:8025"

  app:
    build: .build
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BASELINE_HTTP_PORT:-18080}:80"
